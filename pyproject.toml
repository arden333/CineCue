[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinecue"
version = "0.1.0"
description = "Context-aware movie and TV recommendation project"
requires-python = ">=3.10"
dependencies = [
    "mwparserfromhell>=0.7.2,<0.8",
]

[tool.setuptools.packages.find]
where = ["src"]
